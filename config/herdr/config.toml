onboarding = false
[keys]
prefix = "ctrl+g"
split_vertical = "prefix+|"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
previous_agent = "prefix+,"
next_agent = "prefix+."

[[keys.command]]
key = "prefix+u"
type = "popup"
command = "~/.dotfiles/config/herdr/scripts/new-worktree.sh"
width = "50%"
height = "40%"

[ui]
sidebar_width = 36

[experimental]
pane_history = true
switch_ascii_input_source_in_prefix = true
